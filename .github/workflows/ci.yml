name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 26 only (owner decision 2026-10-31).
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # A spare port: the local container may hold 7834 on this runner.
      - run: CIBALAB_ALLOW_SPARE_PORT=1 PORT=7839 npm run doctor

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # A copy of demo-kit-base's gate (test/kit/demo-kit-conformance.mjs); it scans every other source file, itself
      # included, so it sits under test/. New app: it must exit 0 with --new --tier=Demo.
      - run: node test/kit/demo-kit-conformance.mjs . --new --tier=Demo

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --redact -v
      - name: forbidden strings (history)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then echo "FORBIDDEN_STRINGS secret missing"; exit 1; fi
          printf '%s\n' "$FORBIDDEN_STRINGS" > /tmp/forbidden-strings.txt
          hits=$(git log -p --all | grep -cF -f /tmp/forbidden-strings.txt || true)
          echo "forbidden-string hits: $hits"
          [ "$hits" = "0" ]
      - name: No AI attribution
        run: bash scripts/check-no-ai-attribution.sh


  postman:
    # The Postman collection against the lab's own server: boots on a spare
    # port, runs newman with the committed placeholder environment, fails on
    # any assertion. Regenerate with shared/postman/generator.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the family shared directory
        uses: actions/checkout@v5
        with:
          repository: curtismu7/AI-DEMO-Standalone
          ref: main
          path: family
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build --if-present
      - run: bash family/shared/postman/ci-check.sh ciba-approval-sequence-lab /api/health npm start
